# Obtains a certificate with the ACME wif-01 challenge
# (https://datatracker.ietf.org/doc/draft-rasmussen-acme-wif/), proving
# control of the identifiers with this job's GitHub Actions OIDC token
# instead of DNS/HTTP validation or External Account Binding.
#
# The ACME server must accept the issuer
# https://token.actions.githubusercontent.com and have a policy entry that
# permits this workflow to obtain the identifiers below. Per Appendix A.1 of
# the draft, that policy should match repository_id and repository_owner_id
# (not the mutable names) and constrain ref or environment.
#
# After issuance the job uses the certificate (requested with a
# CERT_LIFETIME validity) as a TLS client certificate against MTLS_TEST_URL.
# It first checks that the endpoint rejects a request without a client
# certificate, then requires the request with the new certificate to succeed.
#
# Replace every value marked TODO before running.

name: ACME wif-01 certificate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request OIDC tokens for the wif-01 challenge

jobs:
  certificate:
    runs-on: ubuntu-latest
    env:
      # ACME server
      ACME_DIRECTORY_URL: https://demo.zaita.com/api/acme/f02df6be-6952-4ab2-856e-66e8d8e7ddb6/directory 
      ACME_CONTACT_EMAIL: "support@zaita.com"

      # CSR fields; list fields are comma-separated
      CSR_COMMON_NAME: mtls-test-client.zaita.com
      CSR_DNS_NAMES: mtls-test-client.zaita.com
      CSR_IP_ADDRESSES: ""
      CSR_ORGANIZATION: Zaita
      CSR_ORGANIZATIONAL_UNIT: Zaita OU
      CSR_COUNTRY: NZ
      CSR_PROVINCE: Wellington
      CSR_LOCALITY: Wellington

      # Short-lived certificate used as an mTLS client credential
      CERT_LIFETIME: 5m
      MTLS_TEST_URL: https://mtls-test.zaita.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Obtain certificate
        run: go run .
